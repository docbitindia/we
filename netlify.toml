[dev]
  command = "npm run dev -- --host 0.0.0.0"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Canonical host
[[redirects]]
  from = "https://www.docbit.in/*"
  to = "https://docbit.in/:splat"
  status = 301
  force = true

# Canonical legacy routes must appear before the SPA catch-all.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/docs"
  to = "/documentation"
  status = 301
  force = true

# SPA application routes
[[redirects]]
  from = "/workspace"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/history"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/report"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/billing"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/password/reset"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/analyzing/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/editing/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/auth/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/workspace*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/report*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/history*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/analyzing*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/editing*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Final SPA fallback — keep this last so specific redirects above can match.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
